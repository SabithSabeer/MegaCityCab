            const baseFare = getBaseFare(vehicleType);
            const perKmFare = getPerKmFare(vehicleType);

            // Fetch the distance between pickup and destination (use a real API here, e.g., Google Maps)
            const distance = getDistance(pickupLocation, destinationLocation); // Mock function
            const totalFare = baseFare + (distance * perKmFare);

            document.getElementById('totalFare').innerText = 'Estimated Fare: $' + totalFare;
        }

        // Mock function to get base fare based on vehicle type
        function getBaseFare(vehicleType) {
            if (vehicleType === 'sedan') return 10;
            if (vehicleType === 'suv') return 15;
            return 0;
        }

            if (vehicleType === 'sedan') return 2;

        function submitBooking() {

    </script>
</head>
<body>
    <header>

    <nav class="navbar">

</header>
    <h1>Book a Cab</h1>
    <form onsubmit="event.preventDefault(); submitBooking();">
        <label for="pickupLocation">Pickup Location:</label>
        <input type="text" id="pickupLocation" required><br><br>

        <label for="destinationLocation">Destination Location:</label>
        <input type="text" id="destinationLocation" required><br><br>

        <label for="vehicleType">Select Vehicle Type:</label>
