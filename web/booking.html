<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Cab - Mega City Cab</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Book Your Ride with Mega City Cab</h1>
    </header>

    <section class="booking-form">
        <form id="bookingForm">
            <label for="pickupLocation">Pickup Location:</label>
            <input type="text" id="pickupLocation" name="pickupLocation" required>

            <label for="destination">Destination:</label>
            <input type="text" id="destination" name="destination" required>

            <label for="pickupDateTime">Date & Time:</label>
            <input type="datetime-local" id="pickupDateTime" name="pickupDateTime" required>

            <label for="vehicleType">Vehicle Type:</label>
            <select id="vehicleType" name="vehicleType" required>
                <!-- Vehicle options will be populated dynamically -->
            </select>

            <label for="passengerCount">Number of Passengers:</label>
            <input type="number" id="passengerCount" name="passengerCount" required min="1">

            <label for="specialRequests">Special Requests:</label>
            <textarea id="specialRequests" name="specialRequests"></textarea>

            <label for="promoCode">Promo Code:</label>
            <input type="text" id="promoCode" name="promoCode">

            <p id="fareEstimate">Estimated Fare: $0</p>

            <button type="submit">Confirm Booking</button>
        </form>
    </section>

    <footer>
        <p>Contact us at support@megacitycab.com</p>
    </footer>

    <script src="booking.js"></script>
</body>
</html>
