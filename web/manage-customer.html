<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Customers - MegaCityCab</title>
    <link rel="stylesheet" href="css/manage-customer.css">
</head>
<body>
    <div class="sidebar">
        <h2>MegaCityCab Admin</h2>
        <ul>
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="manage-driver.html">Manage Drivers</a></li>
            <li><a href="manage-customer.html">Manage Customers</a></li>
            <li><a href="manage-admin-login.html">Manage Admins</a></li>
            <li><a href="manage-vehicles.html">Manage Vehicle Types</a></li>
            <li><a href="index.html">Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Manage Customers</h1>
        </header>

        <!-- Add / Update Customer Form -->
        <section class="form-container">
            <h2>Add / Update Customer</h2>
            <form id="customerForm">
                <input type="hidden" id="customerId">
                <input type="text" id="username" placeholder="Username" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password (Leave empty if not changing)">
                <input type="text" id="phone" placeholder="Phone Number" required>
                <input type="text" id="address" placeholder="Address" required>
                <input type="text" id="nic" placeholder="NIC" required>
                <button type="submit">Save Customer</button>
            </form>
        </section>

        <!-- Customer List Table -->
        <section class="table-container">
            <h2>Customer List</h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>NIC</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody"></tbody>
            </table>
        </section>
    </div>

    <script>
    // Fetch customer data from the servlet
    async function fetchCustomers() {
        try {
            const response = await fetch("ManageCustomerServlet");
            if (!response.ok) throw new Error("Failed to fetch customers");
            const data = await response.json();
            renderCustomers(data);
        } catch (error) {
            console.error("Error fetching customer data:", error);
        }
    }

    // Render customers into the table
    function renderCustomers(customers) {
        const tableBody = document.getElementById("customerTableBody");
        tableBody.innerHTML = "";
        customers.forEach(customer => {
            let row = tableBody.insertRow();
            row.innerHTML = `
                <td>${customer.customerId}</td>
                <td>${customer.username}</td>
                <td>${customer.email}</td>
                <td>${customer.phone}</td>
                <td>${customer.address}</td>
                <td>${customer.nic}</td>
                <td>
                    <button onclick="editCustomer(${customer.customerId}, '${customer.username}', '${customer.email}', '${customer.phone}', '${customer.address}', '${customer.nic}')">Edit</button>
                    <button onclick="deleteCustomer(${customer.customerId})">Delete</button>
                </td>
            `;
        });
    }

    // Handle customer form submission (Add/Update)
    document.getElementById("customerForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const customerId = document.getElementById("customerId").value;
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const phone = document.getElementById("phone").value;
        const address = document.getElementById("address").value;
        const nic = document.getElementById("nic").value;

        let requestData = {
            customerId: customerId ? parseInt(customerId) : 0,
            username,
            email,
            phone,
            address,
            nic
        };

        // Only send password if provided
        if (password.trim()) requestData.password = password;

        try {
            const response = await fetch("ManageCustomerServlet", {
                method: customerId ? "PUT" : "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestData)
            });

            if (!response.ok) throw new Error("Failed to save customer");

            document.getElementById("customerForm").reset();
            document.getElementById("customerId").value = "";
            fetchCustomers(); // Refresh customer list
        } catch (error) {
            console.error("Error saving customer:", error);
        }
    });

    // Edit Customer
    function editCustomer(id, username, email, phone, address, nic) {
        document.getElementById("customerId").value = id;
        document.getElementById("username").value = username;
        document.getElementById("email").value = email;
        document.getElementById("phone").value = phone;
        document.getElementById("address").value = address;
        document.getElementById("nic").value = nic;
        document.getElementById("password").value = ""; // Reset password field on edit
    }

    // Delete Customer
   function deleteCustomer(id) {
    if (confirm("Are you sure you want to delete this customer?")) {
        fetch(`ManageCustomerServlet?customerId=${id}`, { method: "DELETE" })
            .then(() => fetchCustomers()) // Refresh the customer list after deletion
            .catch(error => console.error("Error deleting customer:", error));
    }
    }

    // Load customers on page load
    window.onload = fetchCustomers;
    </script>

</body>
</html>
