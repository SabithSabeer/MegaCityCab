<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="shortcut icon" href="IMAGES/Logo.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mega City Cab</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="IMAGES/Logo.png" alt="Mega City Cab">
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>
    <div class="login-container">
        <div class="login-form">
            <h2>Login to Your Account</h2>
            
            <form action="login" method="POST" id="loginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Login</button>
                
               
                <!-- Display error message if there is an error -->
                <div id="error-message" class="error-message" style="display: none;">Invalid email or password.</div>
            </form>
        </div>
    </div>

    <!-- Inline JavaScript for login validation and AJAX request -->
    <script>
document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (email === "" || password === "") {
        document.getElementById('error-message').style.display = 'block';
        document.getElementById('error-message').innerText = 'Please fill out both fields.';
    } else {
        document.getElementById('error-message').style.display = 'none';

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "adminlogin", true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                console.log("Response from server: " + xhr.responseText);
                if (xhr.responseText.trim() === 'success') {
                    window.location.href = "admin.html";
                } else {
                    document.getElementById('error-message').style.display = 'block';
                    document.getElementById('error-message').innerText = 'Invalid email or password.';
                }
            }
        };
        xhr.send("email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password));
    }
});
    </script>
</body>
</html>
